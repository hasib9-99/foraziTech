<style>

    position: relative;

    }

        display:block;
    }

    overflow:hidden;

}

add_action( 'wp_footer', function () {
?>
<script>
    
document.addEventListener('DOMContentLoaded', () => {

    const DESKTOP_MAX_HEIGHT = 215;
    const MOBILE_MAX_HEIGHT  = 302;
    const BREAKPOINT         = 767;

    const productTitle = "<?php echo esc_js( get_the_title() ); ?>";

    const SVG_UP = `
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
<path d="M15.9992 13.002L11.9996 9.00115L8 13.002" stroke="#595959" stroke-width="1.8" stroke-linecap="square"></path>
</svg>`;

    const SVG_DOWN = `
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" transform="matrix(-1,0,0,-1,0,0)">
<path d="M15.9992 13.002L11.9996 9.00115L8 13.002" stroke="#595959" stroke-width="1.8" stroke-linecap="square"></path>
</svg>`;

    const collapsedHeight = () =>
        window.innerWidth <= BREAKPOINT ? MOBILE_MAX_HEIGHT : DESKTOP_MAX_HEIGHT;

    const setupWrapper = (wrapper) => {

        const grid  = wrapper.querySelector('.custom-followers-grid');
        const cards = wrapper.querySelectorAll('.follower-card');
        if (!grid || cards.length <= (window.innerWidth <= BREAKPOINT ? 9 : 10)) return;

        wrapper.classList.add('has-follower-toggle','followers-show-extra');

        grid.dataset.collapsed = collapsedHeight();
        grid.dataset.full = grid.scrollHeight;

        grid.style.maxHeight = grid.dataset.collapsed + 'px';

        /* Blur */
        const blur = document.createElement('div');
        blur.className = 'followers-blur';
        wrapper.appendChild(blur);

        /* Toggle */
        const toggleWrap = document.createElement('div');
        toggleWrap.className = 'followers-toggle';

        const btn = document.createElement('button');
        btn.className = 'followers-toggle-btn';
        btn.innerHTML = `
            <span class="toggle-prefix">Heb je meer ${productTitle} nodig?</span>
            <span class="toggle-action"><u>Toon meer opties</u>${SVG_DOWN}</span>
        `;

        toggleWrap.appendChild(btn);
        wrapper.appendChild(toggleWrap);

        btn.addEventListener('click', () => {
            const expanded = wrapper.classList.toggle('followers-expanded');

            grid.style.maxHeight = expanded
                ? grid.dataset.full + 'px'
                : grid.dataset.collapsed + 'px';

            btn.innerHTML = expanded
                ? `<span class="toggle-prefix">Heb je meer ${productTitle} nodig?</span>
                   <span class="toggle-action"><u>Opties verbergen</u>${SVG_UP}</span>`
                : `<span class="toggle-prefix">Heb je meer ${productTitle} nodig?</span>
                   <span class="toggle-action"><u>Toon meer opties</u>${SVG_DOWN}</span>`;
        });
    };

    const run = () => {
        document.querySelectorAll('.custom-followers-wrapper').forEach(wrapper => {
            if (!wrapper.dataset.toggleApplied && wrapper.querySelectorAll('.follower-card').length) {
                wrapper.dataset.toggleApplied = '1';
                setupWrapper(wrapper);
            }
        });
    };

    run();

    new MutationObserver(run).observe(document.body,{
        childList:true,
        subtree:true
    });

    window.addEventListener('resize', () => location.reload());
});
</script>
<?php
});
