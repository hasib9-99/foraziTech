<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wix-Like Tilt Animation</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    perspective: 1000px; /* Creates a 3D perspective */
  }

  .row-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
  }

  .row {
    display: flex;
    gap: 20px;
    padding: 20px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    transform-style: preserve-3d;
    opacity: 0;
    animation: tilt-from-left 1.2s ease-out 0s forwards;
  }

  .row-item {
    padding: 20px;
    background: #f9f9f9;
    border-radius: 5px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
  }

  @keyframes tilt-from-left {
    0% {
      transform: translateX(-100px) rotateY(-15deg) rotateX(0deg) scale(0.9);
      opacity: 0;
    }
    100% {
      transform: translateX(0px) rotateY(0deg) rotateX(0deg) scale(1);
      opacity: 1;
    }
  }
</style>
</head>
<body>
<div class="row-container">
  <div class="row">
    <div class="row-item">Item 1</div>
    <div class="row-item">Item 2</div>
    <div class="row-item">Item 3</div>
  </div>
</div>
</body>
</html>
