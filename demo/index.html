<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Slider</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .slider-container {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background-color: #f0f0f0;
    }
    .slider-track {
      display: flex;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      animation: slide 10s linear infinite;
    }
    .slider-item {
      flex: 0 0 auto;
      width: 300px;
      height: 100%;
      background-color: #ccc;
      margin: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #333;
    }
    @keyframes slide {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <div class="slider-container">
    <div class="slider-track" id="slider-track"></div>
  </div>

  <script>
    const track = document.getElementById('slider-track');
    const items = ['Item 1', 'Item 2', 'Item 3', 'Item 4', 'Item 5']; // Example items
    const itemWidth = 320; // Item width including margin

    // Create initial items in the slider
    function createItems() {
      for (let i = 0; i < items.length; i++) {
        const item = document.createElement('div');
        item.classList.add('slider-item');
        item.textContent = items[i];
        track.appendChild(item);
      }
    }

    // Clone items to fill the slider and ensure seamless animation
    function cloneItems() {
      const totalWidth = track.offsetWidth;
      let currentWidth = 0;

      while (currentWidth < window.innerWidth) {
        for (let i = 0; i < items.length; i++) {
          const item = document.createElement('div');
          item.classList.add('slider-item');
          item.textContent = items[i];
          track.appendChild(item);
          currentWidth += itemWidth;
          if (currentWidth >= window.innerWidth) break;
        }
      }
    }

    // Manage the slider by cloning and deleting elements dynamically
    function manageSlider() {
      const firstChild = track.firstElementChild;
      if (firstChild && firstChild.getBoundingClientRect().right <= 0) {
        track.removeChild(firstChild);

        // Create a new item to keep the slider filled
        const newItem = document.createElement('div');
        newItem.classList.add('slider-item');
        newItem.textContent = items[Math.floor(Math.random() * items.length)];
        track.appendChild(newItem);
      }

      requestAnimationFrame(manageSlider);
    }

    // Initialize slider
    function initSlider() {
      createItems();
      cloneItems();
      manageSlider();
    }

    initSlider();
  </script>
</body>
</html>
