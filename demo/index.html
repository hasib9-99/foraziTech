<script>
  let map;
  let markers = []; // store active markers

  function initMap() {
    const crossings = { lat: 40.82703710227426, lng: -73.92508416311576 };

    map = new google.maps.Map(document.getElementById("map"), {
      center: crossings,
      zoom: 12,
      mapTypeControl: false,
      styles: stylesArray // your default styles array
    });

    // 🔹 Style selector logic
    const styleControl = document.getElementById("style-selector-control");
    styleControl.style.display = "none"; // hide the original

    // Clone and push into map controls
    const styleControlClone = styleControl.cloneNode(true);
    map.controls[google.maps.ControlPosition.TOP_LEFT].push(styleControlClone);

    // Use the cloned selector
    const clonedSelector = styleControlClone.querySelector("#style-selector");

    // Apply initial style
    map.setOptions({ styles: styles[clonedSelector.value] });

    // Update map style on change
    clonedSelector.addEventListener("change", () => {
      map.setOptions({ styles: styles[clonedSelector.value] });
    });

    // 🔹 Setup event handlers
    setupCategoryClick();
    setupLocationClick();
  }

  // Clear old markers
  function clearMarkers() {
    markers.forEach(marker => marker.setMap(null));
    markers = [];
  }

  // Category click
  function setupCategoryClick() {
    const locationCats = document.querySelectorAll('.location_cat_item');
    locationCats.forEach(cat => {
      cat.querySelector('.location_cat_name').addEventListener('click', () => {
        const allLocationsItemsCont = document.querySelectorAll('.location_items');
        allLocationsItemsCont.forEach(cont => cont.classList.remove('active'));
        cat.querySelector('.location_items').classList.add('active');
        clearMarkers();

        const locationItems = cat.querySelectorAll('.location_name');

        // Create ONE InfoWindow (reuse it for all markers)
        const infoWindow = new google.maps.InfoWindow();

        locationItems.forEach(item => {
          const lat = parseFloat(item.getAttribute('lat'));
          const lng = parseFloat(item.getAttribute('lng'));

          if (!lat || !lng) return;

          const marker = new google.maps.Marker({
            position: { lat, lng },
            icon: {
              url: 'https://cdn.prod.website-files.com/67f5c6e6e03feab121a17b2e/683b28e6629a46401ada251f_inkwell-marker.png',
              scaledSize: new google.maps.Size(150, 71)
            },
            map,
            title: "Hello World!",
          });

          // Store markers
          markers.push(marker);

          // Get content for InfoWindow (from your DOM element)
          const content = `
          <div style="font-size:14px; line-height:1.4; color: #000;">
            <strong>${item.querySelector('.location_title').textContent}</strong><br>
            <p>${item.querySelector('.location_content').textContent}</p><br>
          </div>
        `;

          // Show InfoWindow when marker clicked
          marker.addListener("click", () => {
            infoWindow.setContent(content);
            infoWindow.open({
              anchor: marker,
              map,
              shouldFocus: false,
            });
          });
        });

        // Auto-center to fit category markers
        if (markers.length > 0) {
          const bounds = new google.maps.LatLngBounds();
          markers.forEach(m => bounds.extend(m.getPosition()));
          map.fitBounds(bounds);
        }
      });
    });
  }


  // Location click
  function setupLocationClick() {
    const locations = document.querySelectorAll('.location_name');
    const infoWindow = new google.maps.InfoWindow(); // reuse a single InfoWindow

    locations.forEach(item => {
      item.addEventListener('click', () => {
        clearMarkers();

        const lat = parseFloat(item.getAttribute('lat'));
        const lng = parseFloat(item.getAttribute('lng'));

        if (!lat || !lng) return;

        const marker = new google.maps.Marker({
          position: { lat, lng },
          icon: {
            url: 'https://cdn.prod.website-files.com/67f5c6e6e03feab121a17b2e/683b28e6629a46401ada251f_inkwell-marker.png',
            scaledSize: new google.maps.Size(150, 71)
          },
          map,
          title: "Hello World!",
        });

        markers.push(marker);

        // InfoWindow content from the DOM
        const content = `
        <div style="font-size:14px; line-height:1.4; color:#000;">
          <strong>${item.querySelector('.location_title').textContent}</strong><br>
          <p>${item.querySelector('.location_content').textContent}</p><br>
        </div>
      `;

        // Open InfoWindow immediately on click
        // infoWindow.setContent(content);
        // infoWindow.open({
        //   anchor: marker,
        //   map,
        //   shouldFocus: false,
        // });

        // Also re-open if marker clicked again
        marker.addListener("click", () => {
          infoWindow.setContent(content);
          infoWindow.open({
            anchor: marker,
            map,
            shouldFocus: false,
          });
        });

        // Center on the clicked marker
        map.setCenter({ lat, lng });
        map.setZoom(15);
      });
    });
  }


  document.addEventListener('DOMContentLoaded', initMap);
</script>
