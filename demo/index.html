<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Function with setTimeout</title>
    <style>
        /* Loading screen style */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2em;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">Loading...</div>

    <div>
        <h1>Welcome to My Website!</h1>
        <p>This content appears after the loading screen is hidden.</p>
    </div>

    <script>
        // Function to hide the loading screen after a timeout
        function hideLoadingScreen() {
            setTimeout(() => {
                const loadingScreen = document.getElementById("loadingScreen");
                loadingScreen.style.display = "none"; // Hide the loading screen after 3 seconds
                console.log("Loading screen hidden after 3 seconds!");
            }, 3000); // 3000 milliseconds (3 seconds)
        }

        // Simulate loading by calling the hideLoadingScreen function
        window.onload = hideLoadingScreen;
    </script>
</body>
</html>
