  <script>
    let map;
    let markers = []; // store active markers

    function initMap() {
      const crossings = { lat: 23.772964, lng: 90.440372 };

      map = new google.maps.Map(document.getElementById("map"), {
        center: crossings,
        zoom: 12,
        mapTypeControl: false,
        styles: stylesArray // your default styles array
      });

      // 🔹 Style selector logic
      const styleControl = document.getElementById("style-selector-control");
      styleControl.style.display = "none"; // hide the original

      // Clone and push into map controls
      const styleControlClone = styleControl.cloneNode(true);
      map.controls[google.maps.ControlPosition.TOP_LEFT].push(styleControlClone);

      // Use the cloned selector
      const clonedSelector = styleControlClone.querySelector("#style-selector");

      // Apply initial style
      map.setOptions({ styles: styles[clonedSelector.value] });

      // Update map style on change
      clonedSelector.addEventListener("change", () => {
        map.setOptions({ styles: styles[clonedSelector.value] });
      });

      // 🔹 Setup event handlers
      setupCategoryClick();
      setupLocationClick();
    }

    // Clear old markers
    function clearMarkers() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
    }

    // Category click
    function setupCategoryClick() {
      const locationCats = document.querySelectorAll('.location_cat_item');
      locationCats.forEach(cat => {
        cat.querySelector('.location_cat_name').addEventListener('click', () => {
          clearMarkers();

          const locationItems = cat.querySelectorAll('.location_name');
          locationItems.forEach(item => {
            const lat = parseFloat(item.getAttribute('lat'));
            const lng = parseFloat(item.getAttribute('lng'));

            const marker = new google.maps.Marker({
              position: { lat, lng },
              icon: {
                url: 'https://cdn.prod.website-files.com/67f5c6e6e03feab121a17b2e/683b28e6629a46401ada251f_inkwell-marker.png',
                scaledSize: new google.maps.Size(150, 71)
              },
              map
            });

            markers.push(marker);
          });

          // Auto-center to fit category markers
          if (markers.length > 0) {
            const bounds = new google.maps.LatLngBounds();
            markers.forEach(m => bounds.extend(m.getPosition()));
            map.fitBounds(bounds);
          }
        });
      });
    }

    // Location click
    function setupLocationClick() {
      const locations = document.querySelectorAll('.location_name');
      locations.forEach(item => {
        item.addEventListener('click', () => {
          clearMarkers();

          const lat = parseFloat(item.getAttribute('lat'));
          const lng = parseFloat(item.getAttribute('lng'));

          const marker = new google.maps.Marker({
            position: { lat, lng },
            icon: {
              url: 'https://cdn.prod.website-files.com/67f5c6e6e03feab121a17b2e/683b28e6629a46401ada251f_inkwell-marker.png',
              scaledSize: new google.maps.Size(150, 71)
            },
            map
          });

          markers.push(marker);

          // Center on the clicked marker
          map.setCenter({ lat, lng });
          map.setZoom(15);
        });
      });
    }


    document.addEventListener('DOMContentLoaded', initMap);
  </script>
