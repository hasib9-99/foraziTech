<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Timeline Animation</title>
  <style>
    body {
      margin: 0;
      height: 300vh; /* Simulate a tall page for scrolling */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scroll-container {
      position: relative;
      width: 100%;
      height: 300px;
      background: lightgray;
    }

    .scroll-box {
      width: 100px;
      height: 100px;
      background-color: coral;
      position: absolute;
      top: 100px;
      left: 0;
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <div class="scroll-box"></div>
  </div>

  <script>
    // Ensure browser support for ScrollTimeline API
    if ('ScrollTimeline' in window) {
      const scrollBox = document.querySelector('.scroll-box');

      // Create a ScrollTimeline
      const scrollTimeline = new ScrollTimeline({
        source: document.scrollingElement,
        orientation: 'block', // Use vertical scrolling
        scrollOffsets: [
          { target: scrollBox, edge: 'start', threshold: 1 },
          { target: scrollBox, edge: 'end', threshold: 0 }
        ],
      });

      // Attach animation to the ScrollTimeline
      scrollBox.animate(
        {
          transform: ['translateX(0)', 'translateX(300px)'], // Move box horizontally
        },
        {
          duration: 1,
          timeline: scrollTimeline,
        }
      );
    } else {
      console.warn('ScrollTimeline is not supported in this browser.');
    }
  </script>
</body>
</html>
