<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Product Animation</title>
<style>
  body {
    height: 300vh;
    margin: 0;
    background: #f7f7f7;
    font-family: Arial, sans-serif;
  }

  .section {
    position: relative;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .product-wrapper {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .product {
    width: 400px;
    height: 400px;
    background-image: url('https://i.pinimg.com/736x/11/2c/93/112c933e00502825649a504ca3ab3947.jpg');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    transform-style: preserve-3d;
    transition: transform 0.1s linear;
    position: fixed;
  }

  h1 {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    font-size: 2em;
  }
</style>
</head>
<body>
<!-- 
<section class="section">
  <h1>Scroll to Rotate the Product</h1>
  <div class="product-wrapper">
    <div class="product"></div>
  </div>
</section> -->

<script>
  const product = document.querySelector('.product');

  window.addEventListener('scroll', () => {
    const scrollTop = window.scrollY;
    const rotation = scrollTop / 5; // smaller = slower rotation
    const scale = 1 + scrollTop / 3000; // smooth zoom-in effect
    product.style.transform = `rotateY(${rotation}deg) scale(${scale})`;
  });
</script>

<script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.88/build/spline-viewer.js"></script>
<spline-viewer url="https://prod.spline.design/w-92D9B-y1xQ02wh/scene.splinecode"></spline-viewer>
</body>
</html>
