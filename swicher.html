<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spline Scroll Section Progress</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    spline-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: -1;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #fff;
    }
  </style>
</head>
<body>

<script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.89/build/spline-viewer.js"></script>
<spline-viewer id="splineViewer" url="https://prod.spline.design/Z3YZItjoDVfkC1hz/scene.splinecode"></spline-viewer>

<section>Section 1 (Rotate)</section>
<section>Section 2 (Move X)</section>
<section>Section 3 (Scale)</section>

<script>
async function initSplineScroll() {
  const viewer = document.getElementById('splineViewer');

  // wait for _spline._scene
  const splineInstance = await new Promise((resolve, reject) => {
    const start = Date.now();
    const interval = setInterval(() => {
      if (viewer._spline && viewer._spline._scene) {
        clearInterval(interval);
        resolve(viewer._spline);
      } else if (Date.now() - start > 10000) {
        clearInterval(interval);
        reject('Spline scene not ready');
      }
    }, 100);
  });

  const scene = splineInstance._scene;

  // collect all objects recursively
  const allObjects = [];
  function collectObjects(obj) {
    if (!obj) return;
    allObjects.push(obj);
    if (obj.children && obj.children.length) {
      obj.children.forEach(child => collectObjects(child));
    }
  }
  scene.children.forEach(child => collectObjects(child));

  // Scroll event
// Utility lerp function
function lerp(start, end, t) {
  return start + (end - start) * t;
}

window.addEventListener('scroll', () => {
  const sections = document.querySelectorAll('section');
  const winH = window.innerHeight;

  sections.forEach((sec, index) => {
    const rect = sec.getBoundingClientRect();
    let progress = (winH - rect.top) / winH;
    progress = Math.min(Math.max(progress, 0), 1);

    allObjects.forEach(obj => {
      if (index === 0) {
        // Smooth rotation
        const targetRotY = progress * Math.PI;
        obj.rotation.y = lerp(obj.rotation.y, targetRotY, 0.1); // 0.1 = smoothing factor
      } else if (index === 1) {
        // Smooth X position
        const targetX = progress * 100;
        obj.position.x = lerp(obj.position.x, targetX, 0.1);
      } else if (index === 2) {
        // Smooth scale
        const targetScale = 1 + progress * 2;
        obj.scale.set(
          lerp(obj.scale.x, targetScale, 0.1),
          lerp(obj.scale.y, targetScale, 0.1),
          lerp(obj.scale.z, targetScale, 0.1)
        );
      }
    });
  });

  splineInstance.requestRender();
});

  console.log('✅ Spline scroll section-specific progress ready');
}

initSplineScroll().catch(console.error);
</script>

</body>
</html>
