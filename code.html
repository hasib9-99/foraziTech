<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Infinite Marquee</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
}

.marquee {
    width:100%;
    overflow:hidden;
    background:#111;
    color:#fff;
    padding:20px 0;
    position:relative;
}

.marquee_track{
    white-space:nowrap;
    display:inline-block;
    animation:scroll 15s linear infinite;
}

.marquee span{
    margin-right:80px;
    font-size:24px;
}

@keyframes scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

</style>
</head>

<body>

<div class="marquee">
    <div class="marquee_track" id="track">
        <span>🚀 Web Development</span>
        <span>🔥 WordPress</span>
        <span>⚡ JavaScript</span>
        <span>💻 React</span>
        <span>🌐 Next.js</span>
    </div>
</div>

<script>

const track = document.getElementById("track");
track.innerHTML += track.innerHTML; // duplicate for seamless loop

</script>

</body>
</html>
