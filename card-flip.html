<script>

yearsData.forEach((year, i) => {
    const percent = (monthDiffs[i] / maxMonths) * 100;

    // description (cleaning HTML)
    const cleanDescription = year.projectDescription 
        ? year.projectDescription.replace(/<[^>]*>/g, '').trim() 
        : '';

    const descriptionBlock = cleanDescription
        ? `<li>
                <p>description</p>
                <span>${cleanDescription}</span>
           </li>`
        : '';

    // project list
    const projectItems = (year.subPosts && year.subPosts.length > 0)
        ? year.subPosts.map((item) => `<li><p>${item.title}</p></li>`).join('')
        : '';

    const projectBlock = projectItems
        ? `<li>
                <p>project</p>
                <ul>${projectItems}</ul>
           </li>`
        : '';

    // final HTML
    const dotHTML = `
    <div class="years" style="position: absolute; left:${percent}%; width: 16px; height: 16px;">
        <div class="year_dot"></div>
        <h2 class="year_text">${year.projectName || ''}</h2>
        <div class="post-content">
            <ul>
                ${descriptionBlock}
                ${projectBlock}
            </ul>
        </div>
    </div>
    `;

    barWraper.insertAdjacentHTML('beforeend', dotHTML);
});

</script>









<script>
    const menuIcon = document.querySelector('.menu_icon');
    const menuPopup = document.querySelector('.menu_popup');
    const popupInner = menuPopup.querySelector('.popup_inner');
    menuIcon.addEventListener('click', () => {
        menuIcon.classList.toggle('active');
        menuPopup.classList.toggle('active');
        if (menuPopup.classList.contains('active')) {
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = 'auto';
        }
    });

    document.addEventListener('click', (e) => {
        if (!popupInner.contains(e.target) && !menuIcon.contains(e.target)) {
            menuIcon.classList.remove('active');
            menuPopup.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    });
</script>


<style>
    .menu_icon{
        height: 40px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .line{
        display: block;
        width: 100%;
        height: 2px;
        background-color: white;
        transition: all 0.3s ease;
    }
    .menu_icon.active .line._1{
        transform: rotate(45deg) translate(5px, 5px);
        width: 100%;
    }
    .menu_icon.active .line._2{
        transform: rotate(-45deg) translate(5px, -5px);
        width: 100%;
    }
</style>

<div class="menu_icon ">
    <span class="line _1"></span>
