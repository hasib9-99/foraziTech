<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;

        }
        .lines{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: flex-end;
            align-items: flex-end;
        }
        .line{
            background-color: #fff;
            height: 1px;
            width: 100%;
        }
        .lines .line:nth-child(1){
            width: 90%;
            transition: width 0.8s linear;
        }
        .lines:hover .line:nth-child(1){
            width: 100%;
        }
    </style>
</head>
<body>
<div class="lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
</div>
</body>
</html>
