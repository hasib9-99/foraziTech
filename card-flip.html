<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wavy Hover Effect</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .wavy-hover img {
      width: 300px;
      height: auto;
      transition: filter 0.3s ease;
    }

    .wavy-hover img:hover {
      filter: url(#wavy);
    }

    svg {
      position: absolute;
      width: 0;
      height: 0;
    }
  </style>
</head>
<body>
  <div class="wavy-hover">
    <img src="https://janssenstaalwerk.nl/wp-content/uploads/2024/03/Home-Janssen-Staalwerk-section3.1.1.jpg.webp" alt="Wavy Image">
    <svg xmlns="http://www.w3.org/2000/svg"  shape-rendering="geometricPrecision" width="700" height="400">
      <link href="https://fonts.googleapis.com/css?family=Oswald:600" rel="stylesheet"/>

<defs>
  <!-- define styles -->
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css?family=Oswald:600');

    #svg_7 {
      filter: url(#waterTexture);
      font-size: 140px;
      font-family: 'Oswald', sans-serif;
    }

  </style>

  <!-- define water texture filter -->
  <filter id="wavy" >


    <img src="/demo/0.jpg" alt="">

</svg>
  </div>
</body>
</html>
