<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <style>
    .menu_con{
      padding: 10px;
      border: 1px solid #000;
      border-radius: 50px;
      display: inline-block;
    }
    .burger-menu{
        height: 20px;
        width: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
    }
    .bar{
        position: absolute;
        width: 75%;
        height: 2px;
        transition: transform 250ms cubic-bezier(.2,.6,.3,1), width 250ms cubic-bezier(.2,.6,.3,1);
        will-change: transform, width;
        background: #000;
    }
    /**/
    .burger-menu .top-bun{
        top: 0
    }
    .burger-menu .patty{
        top: calc(50% - 1px);
        right: 0;
    }
    .burger-menu .bottom-bun{
        bottom: 0
    }
    
    /**/
    .burger-menu.active .top-bun{
        transform: rotate(-135deg);
        top: 50%;
        width: 100%;
    }
    .burger-menu.active .patty{
        transform: scale(0);
        top: 50%;
    }
    .burger-menu.active .bottom-bun{
        transform: rotate(135deg);
        top: 50%;
        width: 100%;
    }
    </style>
    
    
    <div class="menu_con">
      <div class="burger-menu">
        <div class="bar top-bun"></div>
        <div class="bar patty"></div>
        <div class="bar bottom-bun"></div>
      </div>
    </div>


    <script>
    
    </script>
</body>
</html>
