<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk Word Counter</title>
<style>
body { font-family: Arial; padding: 20px; background: #f5f5f5; }
h1 { text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
th { background: #eee; }
button { padding: 5px 10px; margin: 2px; }
#status { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<h1>Office Word Counter</h1>

<table>
<thead>
<tr>
<th>Name</th>
<th>Words Spoken</th>
</tr>
</thead>
<tbody id="table-body">
<!-- Rows created by JS -->
</tbody>
</table>

<div id="status">Status: OFF</div>
<button id="startBtn">Start Listening</button>
<button id="stopBtn">Stop Listening</button>

<script>
if(!('webkitSpeechRecognition' in window)) {
    alert("Speech Recognition not supported in this browser. Use Chrome.");
}

const people = ["A","B","C","D","E","F"];
let wordCounts = {};
people.forEach(p => wordCounts[p] = 0);

// Generate table rows
const tbody = document.getElementById("table-body");
people.forEach(p => {
    const tr = document.createElement("tr");
    const tdName = document.createElement("td");
    tdName.textContent = p;
    const tdCount = document.createElement("td");
    tdCount.id = "count-"+p;
    tdCount.textContent = 0;
    tr.appendChild(tdName);
    tr.appendChild(tdCount);
    tbody.appendChild(tr);
});

// Speech Recognition
let recognition = new webkitSpeechRecognition();
recognition.continuous = true;
recognition.interimResults = true;
recognition.lang = 'en-US';
let status = document.getElementById("status");

// Assign speaker manually for demo
let currentPersonIndex = 0; // In real office, assign mic per person
function getCurrentPerson() { return people[currentPersonIndex]; }

recognition.onresult = function(event) {
    for (let i = event.resultIndex; i < event.results.length; i++) {
        if(event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            const wordCount = transcript.split(/\s+/).length;
            const person = getCurrentPerson();
            wordCounts[person] += wordCount;
            document.getElementById("count-"+person).textContent = wordCounts[person];
            console.log(`${person} spoke ${wordCount} words: "${transcript}"`);
        }
    }
};

document.getElementById("startBtn").addEventListener("click", () => {
    recognition.start();
    status.textContent = "Status: LISTENING";
});

document.getElementById("stopBtn").addEventListener("click", () => {
    recognition.stop();
    status.textContent = "Status: OFF";
});

// Demo: switch speaker every 10s
setInterval(()=>{ currentPersonIndex = (currentPersonIndex+1)%people.length; }, 10000);
</script>

</body>
</html>
