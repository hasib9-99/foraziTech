<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Perspective Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 20px;
      background: #eee;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .custom_slider {
      width: 100%;
      height: 40vw;
      /* max-width: 500px; */
      /* max-height: 350px; */
      position: relative;
      perspective: 1000px;
      transform-style: preserve-3d;
    }

    .slide {
      width: 80%;
      height: 80%;
      position: absolute;
      left: 10%;
      top: 10%;
      border-radius: 10px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }

    .slide:nth-child(1) { background: #00BCD4; }
    .slide:nth-child(2) { background: #4CAF50; }
    .slide:nth-child(3) { background: #CDDC39; }
    .slide:nth-child(4) { background: #FFC107; }
    .slide:nth-child(5) { background: #FF5722; }

    /* Positioning slides dynamically */
    .slide.hidden { transform: translate3d(30%, 0, -200px);}
    .slide.next { transform: translate3d(15%, 0, -100px); z-index: 20;}
    .slide.active { transform: translate3d(0, 0, 0); z-index: 20;}
    .slide.prev { transform: translate3d(-15%, 0, -100px); z-index: 15;}
    .slide.hidden-left { transform: translate3d(-30%, 0, -200px);}

  </style>
</head>
<body>

  <div class="custom_slider">
    <div class="slide active"></div>
    <div class="slide next"></div>
    <div class="slide hidden-left"></div>
    <div class="slide hidden"></div>
    <div class="slide prev"></div>
  </div>

  <script>





    const slides = document.querySelectorAll(".slide");
    let currentIndex = 0;

function updateSlides() {
  slides.forEach((slide, index) => {
    slide.classList.remove("active", "prev", "next", "hidden", "hidden-left");

    // Clone the current slide and change its tag
    const newSlide = document.createElement(index === currentIndex ? 'a' : 'div');
    
    // Copy all attributes and children from the original slide
    newSlide.innerHTML = slide.innerHTML;
    Array.from(slide.attributes).forEach(attr => {
      newSlide.setAttribute(attr.name, attr.value);
    });

    // Replace the old slide with the new one
    slide.parentNode.replaceChild(newSlide, slide);

    // Now use the new element for further logic
    slide = newSlide; // Reassign slide to the new element

    // Add the appropriate classes
    if (index === currentIndex) {
      slide.classList.add("active");
    } else if (index === (currentIndex + 1) % slides.length) {
      slide.classList.add("next");
    } else if (index === (currentIndex - 1 + slides.length) % slides.length) {
      slide.classList.add("prev");
    } else if (index === (currentIndex + 2) % slides.length) {
      slide.classList.add("hidden");
    } else {
      slide.classList.add("hidden-left");
    }
  });
}



    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      updateSlides();
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateSlides();
    }

    slides.forEach((slide) => {
      slide.addEventListener("click", (event) => {
        if (event.target.classList.contains("next")) {
          nextSlide();
        } else if (event.target.classList.contains("prev")) {
          prevSlide();
        }
      });
    });

    // setInterval(nextSlide, 3000); // Auto slide every 3 seconds
    updateSlides();










  </script>

</body>
</html>
