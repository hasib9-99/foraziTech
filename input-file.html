.burger-menu-line-1{transform: translate3d(0px, 0px, 0px) rotateZ(0deg);}
.burger-menu-line-2{opacity: 1;}
.burger-menu-line-3{transform: translate3d(0%, 0px, 0px) rotateZ(0deg);}

.custom_btn.active .burger-menu .burger-menu-line-1{transform: translate3d(0px, 8px, 0px) rotateZ(45deg);}
.custom_btn.active .burger-menu .burger-menu-line-2{opacity: 0;}
.custom_btn.active .burger-menu .burger-menu-line-3{transform: translate3d(0px, -8px, 0px) rotateZ(-45deg);}

<h2>Endless JS Marquee (Calculated)</h2>
<div class="marquee-container">
  <div class="marquee-track" id="track">
    <img src="https://cdn.prod.website-files.com/68c8db254a990457b042c713/68dcc1efcfa5a9eb3b11df01_Betterware.webp" alt="">
    <img src="https://cdn.prod.website-files.com/68c8db254a990457b042c713/68dcc1efcfa5a9eb3b11df01_Betterware.webp" alt="">
    <img src="https://cdn.prod.website-files.com/68c8db254a990457b042c713/68dcc1efcfa5a9eb3b11df01_Betterware.webp" alt="">
    <img src="https://cdn.prod.website-files.com/68c8db254a990457b042c713/68dcc1efcfa5a9eb3b11df01_Betterware.webp" alt="">
    <img src="https://cdn.prod.website-files.com/68c8db254a990457b042c713/68dcc1efcfa5a9eb3b11df01_Betterware.webp" alt="">
  </div>
</div>

<script>
const track = document.getElementById('track');
const container = track.parentElement;
const speed = 1;
let x = 0;

// Duplicate images to fill container width
function fillImages() {
  const imgs = Array.from(track.children);
  let totalWidth = 0;
  imgs.forEach(img => totalWidth += img.offsetWidth + 10); // image width + margin

  // Repeat images until total width > container width * 2
  while (totalWidth < container.offsetWidth * 2) {
    imgs.forEach(img => {
      const clone = img.cloneNode(true);
      track.appendChild(clone);
      totalWidth += clone.offsetWidth + 10;
    });
  }
}

// Run after images load
window.onload = () => {
  fillImages();
  animate();
};

// Infinite scroll
function animate() {
  x -= speed;
  track.style.transform = `translateX(${x}px)`;

  // If first image out of view, move it to end
  const firstImg = track.children[0];
  if (firstImg.getBoundingClientRect().right < 0) {
    track.appendChild(firstImg);
    x += firstImg.offsetWidth + 10;
  }

  requestAnimationFrame(animate);
}

// Handle window resize
window.addEventListener('resize', () => {
  x = 0;
  track.style.transform = `translateX(0px)`;
  fillImages();
});
</script>


























<style>
.burger-menu{
    height: 1.2em;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.burger-menu-line-1,
.burger-menu-line-2,
.burger-menu-line-3{
    height: 1px;
    width: 100%;
    background: #f0f0f0;

    --tx: 0px;
    --ty: 0px;
    --rotate: 0deg;

    transform: translate3d(var(--tx), var(--ty), 0) rotateZ(var(--rotate));
    transition:
        transform 0.2s linear, 
        opacity 0.2s linear;  
}

.burger-menu-line-2 { opacity: 1; }

.custom_btn.active .burger-menu .burger-menu-line-1{ --tx: 0px; --ty: 8px; }
.custom_btn.active .burger-menu .burger-menu-line-2{ opacity: 0; }
.custom_btn.active .burger-menu .burger-menu-line-3{ --tx: 0px; --ty: -8px; }

.custom_btn.active.delay .burger-menu .burger-menu-line-1{
    transition-delay: 0.2s;
    --rotate: 45deg;
}
.custom_btn.active.delay .burger-menu .burger-menu-line-3{
    transition-delay: 0.2s;
    --rotate: -45deg;
}

.custom_btn:not(.active) .burger-menu div{
    transition-delay: 0s !important;
}
</style>

<div class="custom_btn">
    <div class="burger-menu">
        <div class="burger-menu-line-1"></div>
        <div class="burger-menu-line-2"></div>
        <div class="burger-menu-line-3"></div>
    </div>
</div>

<script>
const menuBtn = document.querySelector('.custom_btn');

menuBtn.addEventListener('click', () => {
    menuBtn.classList.toggle('active');

    if(menuBtn.classList.contains('active')){
        setTimeout(() => menuBtn.classList.add('delay'), 200);
    } else {
        menuBtn.classList.remove('delay');
    }
});
</script>
