<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Infinite Left Slider</title>
<style>
  
  :root{
    --gap: 16px;
    --speed-px-per-sec: 100; /* change to go faster/slower */
  }

  body{
    font-family: system-ui, sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    background: #0f172a;
    color: #e6eef8;
  }

  .slider_wrap{
    width: min(1100px, 96%);
    border-radius: 10px;
    overflow: hidden;
    background: linear-gradient(180deg,#08102a 0%, #0b1530 100%);
    padding: 12px;
    box-shadow: 0 8px 30px rgba(5,10,20,0.6);
  }

  /* viewport that will be scrolled via scrollLeft */
  .slider{
    overflow: hidden;           /* hide overflow */
    white-space: nowrap;        /* keep slides inline */
    -webkit-overflow-scrolling: touch;
    cursor: grab;
  }

  /* the track holds inline-block slides */
  .track{
    display: inline-block;
    vertical-align: top;
  }

  .slide{
    display: inline-block;     /* important: inline-block keeps them inline */
    width: 260px;              /* slide width (change as needed) */
    height: 160px;
    margin-right: var(--gap);
    border-radius: 8px;
    background: linear-gradient(135deg,#334155,#0f172a);
    color: #fff;
    box-shadow: 0 6px 18px rgba(2,6,23,0.6);
    text-align: center;
    line-height: 160px;
    font-weight: 600;
    user-select: none;
  }

  .slide img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    vertical-align: middle;
  }

  .controls{
    margin-top: 10px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .controls button{
    background: #152238;
    border: 1px solid rgba(255,255,255,0.06);
    color: #cfe3ff;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
  }

  .hint{font-size:13px; opacity:.8; text-align:center; margin-top:8px}
</style>
</head>
<body>

<div class="slider_wrap">
  <div class="slider" id="slider" aria-label="Infinite left slider">
    <div class="track" id="track">
      <!-- slides: you can replace content with images or any HTML -->
      <div class="slide">Slide 1</div>
      <div class="slide">Slide 2</div>
      <div class="slide">Slide 3</div>
      <div class="slide">Slide 4</div>
      <div class="slide">Slide 5</div>
      <div class="slide">Slide 6</div>
    </div>
  </div>

  <!-- <div class="controls">
    <button id="faster">Faster</button>
    <button id="slower">Slower</button>
    <button id="toggle">Pause</button>
  </div> -->

  <div class="hint">Hover to pause. Drag to scroll manually. Uses scrollLeft (no translateX).</div>
</div>

<script>
/*
  Infinite left slider using scrollLeft.
  - Duplicates track content so we can loop seamlessly
  - Uses requestAnimationFrame for smooth motion
  - No translateX, no flex; slides are inline-block
*/

(() => {
  const slider = document.querySelector('.custom_slider');
  const track  = document.querySelector('.track');

  // duplicate slides for seamless loop
  function duplicateContent() {
    const html = track.innerHTML;
    track.insertAdjacentHTML('beforeend', html);
  }

  duplicateContent();

  // After duplication, original width is half of track.scrollWidth
  let originalWidth = null;
  function refreshWidths(){
    // small delay to ensure layout settled
    requestAnimationFrame(() => {
      originalWidth = track.scrollWidth / 2;
    });
  }
  refreshWidths();
  // speed in pixels per second (change root var or JS var)
  let speed = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--speed-px-per-sec')) || 100;

  let rafId = null;
  let lastTS = null;
  let running = true;

  function step(ts){
    if (!lastTS) lastTS = ts;
    const dt = ts - lastTS; // ms
    lastTS = ts;

    if (running) {
      // advance scrollLeft to the left (increasing scrollLeft moves content left)
      slider.scrollLeft += (speed * dt / 1000); // px

      // when we've scrolled past the width of original content, loop back
      if (slider.scrollLeft >= originalWidth) {
        // subtract originalWidth to seamlessly wrap
        slider.scrollLeft -= originalWidth;
      }
    }

    rafId = requestAnimationFrame(step);
  }

  // start animation
  rafId = requestAnimationFrame(step);

  // Pause on hover
  slider.addEventListener('mouseenter', () => running = true);
  slider.addEventListener('mouseleave', () => { running = true; lastTS = null; });

  // simple drag-to-scroll
  let isDown = false;
  let startX, startScroll;
  slider.addEventListener('mousedown', (e) => {
    isDown = true;
    slider.classList.add('dragging');
    startX = e.pageX;
    startScroll = slider.scrollLeft;
    running = false; // pause autoplay while dragging
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const dx = e.pageX - startX;
    slider.scrollLeft = startScroll - dx;
  });
  window.addEventListener('mouseup', () => {
    if (!isDown) return;
    isDown = false;
    running = true;
  });

  // Make sure widths recompute on resize (important for responsiveness)
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      refreshWidths();
    }, 120);
  });

  // controls
  // document.getElementById('faster').addEventListener('click', () => { speed = Math.min(1000, speed + 30); });
  // document.getElementById('slower').addEventListener('click', () => { speed = Math.max(10, speed - 30); });
  // const toggleBtn = document.getElementById('toggle');
  // toggleBtn.addEventListener('click', () => {
  //   running = !running;
  //   toggleBtn.textContent = running ? 'Pause' : 'Play';
  //   if (running) lastTS = null; // reset delta to avoid jump
  // });

  // // Accessibility: allow keyboard to pause
  // slider.tabIndex = 0;
  // slider.addEventListener('focus', () => running = false);
  // slider.addEventListener('blur', () => running = true);

  // // ensure initial scrollLeft aligned
  slider.scrollLeft = 0;

})();
</script>

</body>
</html>
