<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        selector .elementor-form-fields-wrapper.elementor-labels-above{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 70px);
            /* gap: 20px; */
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div{
            width: 100% !important;
        }
        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(1) {
            grid-area: 1 / 1 / 2 / 2;
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(2) {
            grid-area: 1 / 2 / 2 / 2;
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(3) {
            grid-area: 2 / 1 / 3 / 2;
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(4) {
            grid-area: 2 / 2 / 4 / 3;
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(5) {
            grid-area: 3 / 1 / 4 / 2;
        }

        selector .elementor-form-fields-wrapper.elementor-labels-above > div:nth-child(6) {
            grid-area: 5 / 1 / 4 / 3;
            align-content: flex-start !important;
        }
    </style>
</body>

</html>
