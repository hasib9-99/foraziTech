<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wedding Slider</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      overflow-x: hidden;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      margin: 50px auto;
      overflow: hidden;
    }

    .slider-track {
      display: flex;
      transition: transform 0.6s ease-in-out;
    }

    .slide {
      min-width: 100%;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f9f9f9;
      padding: 20px;
    }

    .slide img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    /* Navigation */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 10px 15px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 18px;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .nav-btn:hover {
      background: rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <div class="slider-container">
    <div class="slider-track">
      <div class="slide"><img src="https://via.placeholder.com/1000x400?text=Wedding+Invite+1" alt="Slide 1"></div>
      <div class="slide"><img src="https://via.placeholder.com/1000x400?text=Wedding+Invite+2" alt="Slide 2"></div>
      <div class="slide"><img src="https://via.placeholder.com/1000x400?text=Wedding+Invite+3" alt="Slide 3"></div>
      <div class="slide"><img src="https://via.placeholder.com/1000x400?text=Wedding+Invite+4" alt="Slide 4"></div>
    </div>
    <button class="nav-btn prev">&#10094;</button>
    <button class="nav-btn next">&#10095;</button>
  </div>

  <script>
    const track = document.querySelector('.slider-track');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.querySelector('.prev');
    const nextBtn = document.querySelector('.next');
    let index = 0;

    function updateSlide() {
      track.style.transform = `translateX(-${index * 100}%)`;
    }

    nextBtn.addEventListener('click', () => {
      index = (index + 1) % slides.length;
      updateSlide();
    });

    prevBtn.addEventListener('click', () => {
      index = (index - 1 + slides.length) % slides.length;
      updateSlide();
    });
  </script>
</body>
</html>
