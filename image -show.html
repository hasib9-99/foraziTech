<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button id="demoButton"> Lorem ipsum dolor sit amet.</button>

  <script>
const button = document.getElementById('demoButton');

// Action for pressing the button
button.addEventListener('mousedown', () => {
    console.log('Button pressed (mousedown): Action 1 triggered!');
    button.style.backgroundColor = 'lightblue'; // Example visual feedback
});

// Action for releasing the button
button.addEventListener('mouseup', () => {
    console.log('Button released (mouseup): Action 2 triggered!');
    button.style.backgroundColor = 'red'; // Reset visual feedback
});

button.addEventListener('mousemove', () => {
    console.log('Button released (mouseup): Action 3 triggered!');
    button.style.backgroundColor = 'blue'; // Reset visual feedback
});


  </script>
</body>                                                                                     
</html>
