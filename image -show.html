<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll and Translate</title>
  <style>
    body {
      margin: 0;
      overflow-y: scroll;
      height: 200vh; /* For scrolling effect */
      font-family: Arial, sans-serif;
    }

    .scroll-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .number-container {
      position: fixed;
      top: 50%;
      left: 10%;
      transform: translateY(-50%);
    }

    .number {
      font-size: 2rem;
      margin: 10px 0;
      transition: transform 0.3s;
    }

    .content-container {
      display: flex;
      flex-direction: column;
      margin-left: 20%;
    }

    .content {
      margin: 20px 0;
      padding: 20px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      transition: transform 0.3s;
    }
  </style>
</head>
<body>
  <div class="scroll-container">
    <div class="number-container">
      <div class="number" data-translate="50">1</div>
      <div class="number" data-translate="100">2</div>
      <div class="number" data-translate="150">3</div>
    </div>
    <div class="content-container">
      <div class="content">Container 1</div>
      <div class="content">Container 2</div>
      <div class="content">Container 3</div>
    </div>
  </div>

  <script>
    document.addEventListener("scroll", () => {
      const scrollPosition = window.scrollY;
      
      // Translate numbers based on their data-translate attribute
      document.querySelectorAll(".number").forEach((number, index) => {
        const translateValue = parseInt(number.dataset.translate, 10) || 0;
        number.style.transform = `translateY(${scrollPosition / 2 - translateValue}px)`;
      });

      // Translate content containers
      document.querySelectorAll(".content").forEach((content, index) => {
        content.style.transform = `translateX(${scrollPosition / 2 - index * 100}px)`;
      });
    });
  </script>
</body>
</html>
