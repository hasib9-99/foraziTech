<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Tabs</title>
  <style>
    .tab-content {
      display: none;
      padding: 10px;
      background: #f2f2f2;
      margin-top: 5px;
    }

    .tab-content.active {
      display: block;
    }

    @media (max-width: 768px) {
      .tab {
        display: flex;
        flex-direction: column;
      }

      .tab-btns {
        display: flex;
        flex-direction: column;
      }

      .tab-contents {
        display: none; /* Hide shared contents on mobile */
      }

      .tab-btn {
        width: 100%;
        text-align: left;
      }

      .mobile-tab-content {
        display: none;
      }

      .mobile-tab-content.active {
        display: block;
        background: #f2f2f2;
        margin-top: 5px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="tab">
  <div class="tab-btns">
    <button class="tab-btn" data-tab="0">Tab 1</button>
    <button class="tab-btn" data-tab="1">Tab 2</button>
    <button class="tab-btn" data-tab="2">Tab 3</button>
  </div>

  <div class="tab-contents">
    <div class="tab-content">Content for Tab 1</div>
    <div class="tab-content">Content for Tab 2</div>
    <div class="tab-content">Content for Tab 3</div>
  </div>
</div>

<script>
const tabButtons = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');

// Create mobile content under each button
tabButtons.forEach((button, index) => {
  const mobileContent = tabContents[index].cloneNode(true);
  mobileContent.classList.add('mobile-tab-content');
  button.insertAdjacentElement('afterend', mobileContent);
});

const mobileContents = document.querySelectorAll('.mobile-tab-content');

function resetDesktop() {
  tabContents.forEach(content => content.classList.remove('active'));
}

function resetMobile() {
  tabButtons.forEach(btn => btn.classList.remove('active'));
  mobileContents.forEach(content => content.classList.remove('active'));
}

function isMobile() {
  return window.innerWidth <= 768;
}

tabButtons.forEach((button, index) => {
  button.addEventListener('click', () => {
    if (!isMobile()) {
      // Desktop behavior
      resetDesktop();
      tabContents[index].classList.add('active');
    } else {
      // Mobile behavior
      if (button.classList.contains('active')) {
        button.classList.remove('active');
        mobileContents[index].classList.remove('active');
      } else {
        resetMobile();
        button.classList.add('active');
        mobileContents[index].classList.add('active');
      }
    }
  });
});
</script>

</body>
</html>
